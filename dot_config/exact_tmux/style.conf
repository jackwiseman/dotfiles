#
# styles
#
# Color variables ($black, $blue, …) are defined in gruvbox.conf,
# which tmux.conf sources before this file.

set-option -g status-style bg=$darkgray

set-option -g window-status-current-style fg=$white,bg=$lightgray

set-option -g pane-active-border-style fg=default
set-option -g pane-active-border-style bg=default

set -g status-left ' #S '
set -g status-left-style bg=$blue,fg=$black
set -g status-left-length 30


setw -g automatic-rename on
# Claude Code sets its own argv[0] to its version (e.g. "2.1.153"), which would
# leak into the window name. Substitute a stable "claude" label for any
# version-shaped command name.
setw -g automatic-rename-format "#{?#{m/r:^[0-9]+\\.[0-9]+\\.[0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}"

setw -g window-status-format         " #W#F "
setw -g window-status-current-format " #W#F "
# claude usage (5h/weekly %, claude-usage.sh) at the far right
set -g status-right "#h #(~/.config/tmux/claude-usage.sh)"
set -g status-right-length 100

# flag windows whose pane rings a bell — silent, auto-clears on visit
setw -g monitor-bell on
set -g bell-action any
set -g visual-bell off
setw -g window-status-bell-style fg=$black,bg=$yellow,bold

# highlighting
set -g mode-style fg=$black,bg=$yellow

# command prompt
set -g message-command-style fg=$yellow,bg=$darkgray
set -g message-style fg=$yellow,bg=$black
